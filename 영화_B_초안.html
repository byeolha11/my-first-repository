<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마블 영화 티어리스트</title>
<style>
  :root {
    --bg: #14151a;
    --panel: #1d1f26;
    --line: #2c2f3a;
    --text: #e8e9ee;
    --muted: #9095a5;
    --accent: #e23636;
    --card-w: 84px;
    --card-h: 126px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  .header-info { color: var(--muted); font-size: 13px; }
  .btn {
    background: transparent; color: var(--text); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .btn:hover { border-color: var(--accent); color: #fff; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }

  /* 티어 테이블 */
  .tier-table { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tier-row { display: flex; min-height: calc(var(--card-h) + 12px); border-bottom: 1px solid var(--line); }
  .tier-row:last-child { border-bottom: none; }
  .tier-label {
    flex: 0 0 90px; display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 800; color: #1a1a1a;
  }
  .tier-items, .pool-items {
    flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding: 6px;
    background: var(--panel); transition: background .15s;
  }
  .drag-over { background: #2a2d38 !important; outline: 2px dashed var(--accent); outline-offset: -4px; }

  /* 미분류 대기열 */
  .pool { margin-top: 28px; }
  .pool-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .pool-head h2 { margin: 0; font-size: 17px; }
  .pool-head small { color: var(--muted); }
  .pool-items { min-height: calc(var(--card-h) + 12px); border: 1px solid var(--line); border-radius: 8px; }
  .empty-msg { color: var(--muted); font-size: 13px; padding: 10px; }

  /* 카드 */
  .card {
    position: relative; width: var(--card-w); height: var(--card-h); border-radius: 4px; overflow: hidden;
    cursor: grab; flex-shrink: 0; background: #2b2e3a; user-select: none;
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .35; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .card .fallback {
    width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 6px; text-align: center; font-size: 11px; line-height: 1.3; word-break: keep-all;
    background: linear-gradient(160deg, #8b1e1e, #2b2e3a 70%);
  }
  .card .fallback .yr { margin-top: 6px; color: #c8c9d0; font-size: 10px; }
  .card .title-bar {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 4px; font-size: 10px;
    background: rgba(0,0,0,.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .15s;
  }
  .card:hover .title-bar { opacity: 1; }
  .card .edit {
    position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border: none; border-radius: 50%;
    background: rgba(0,0,0,.7); color: #fff; font-size: 11px; cursor: pointer; opacity: 0; transition: opacity .15s;
  }
  .card:hover .edit { opacity: 1; }
  .card.insert-before { box-shadow: -4px 0 0 var(--accent); }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #2b2e3a; border: 1px solid var(--line); padding: 10px 18px; border-radius: 6px;
    font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div>
    <h1><span>MARVEL</span> 영화 티어리스트</h1>
    <div class="header-info">포스터를 끌어다 원하는 등급에 놓으세요 · 변경 사항은 자동 저장됩니다</div>
  </div>
  <button class="btn" id="resetBtn">전체 초기화</button>
</header>

<main>
  <section class="tier-table" id="tierTable"></section>

  <section class="pool">
    <div class="pool-head">
      <h2>미분류 대기열</h2>
      <small id="poolCount"></small>
    </div>
    <div class="pool-items" id="pool" data-zone="POOL"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1. 영화 데이터
   - poster 칸에 외부 이미지 URL을 넣으면 포스터가 표시됩니다.
   - 비워 두면 제목 카드로 표시되며, 화면에서 카드의 ✎ 버튼으로도
     URL을 지정할 수 있습니다(브라우저에 자동 저장).
   ========================================================= */
const MOVIES = [
  { id: "m01", title: "아이언맨", year: 2008, poster: "" },
  { id: "m02", title: "인크레더블 헐크", year: 2008, poster: "" },
  { id: "m03", title: "아이언맨 2", year: 2010, poster: "" },
  { id: "m04", title: "토르: 천둥의 신", year: 2011, poster: "" },
  { id: "m05", title: "퍼스트 어벤져", year: 2011, poster: "" },
  { id: "m06", title: "어벤져스", year: 2012, poster: "" },
  { id: "m07", title: "아이언맨 3", year: 2013, poster: "" },
  { id: "m08", title: "토르: 다크 월드", year: 2013, poster: "" },
  { id: "m09", title: "캡틴 아메리카: 윈터 솔져", year: 2014, poster: "" },
  { id: "m10", title: "가디언즈 오브 갤럭시", year: 2014, poster: "" },
  { id: "m11", title: "어벤져스: 에이지 오브 울트론", year: 2015, poster: "" },
  { id: "m12", title: "앤트맨", year: 2015, poster: "" },
  { id: "m13", title: "캡틴 아메리카: 시빌 워", year: 2016, poster: "" },
  { id: "m14", title: "닥터 스트레인지", year: 2016, poster: "" },
  { id: "m15", title: "가디언즈 오브 갤럭시 Vol. 2", year: 2017, poster: "" },
  { id: "m16", title: "스파이더맨: 홈커밍", year: 2017, poster: "" },
  { id: "m17", title: "토르: 라그나로크", year: 2017, poster: "" },
  { id: "m18", title: "블랙 팬서", year: 2018, poster: "" },
  { id: "m19", title: "어벤져스: 인피니티 워", year: 2018, poster: "" },
  { id: "m20", title: "앤트맨과 와스프", year: 2018, poster: "" },
  { id: "m21", title: "캡틴 마블", year: 2019, poster: "" },
  { id: "m22", title: "어벤져스: 엔드게임", year: 2019, poster: "" },
  { id: "m23", title: "스파이더맨: 파 프롬 홈", year: 2019, poster: "" },
  { id: "m24", title: "블랙 위도우", year: 2021, poster: "" },
  { id: "m25", title: "샹치와 텐 링즈의 전설", year: 2021, poster: "" },
  { id: "m26", title: "이터널스", year: 2021, poster: "" },
  { id: "m27", title: "스파이더맨: 노 웨이 홈", year: 2021, poster: "" },
  { id: "m28", title: "닥터 스트레인지: 대혼돈의 멀티버스", year: 2022, poster: "" },
  { id: "m29", title: "토르: 러브 앤 썬더", year: 2022, poster: "" },
  { id: "m30", title: "블랙 팬서: 와칸다 포에버", year: 2022, poster: "" },
  { id: "m31", title: "앤트맨과 와스프: 퀀텀매니아", year: 2023, poster: "" },
  { id: "m32", title: "가디언즈 오브 갤럭시: Volume 3", year: 2023, poster: "" },
  { id: "m33", title: "더 마블스", year: 2023, poster: "" },
  { id: "m34", title: "데드풀과 울버린", year: 2024, poster: "" },
  { id: "m35", title: "캡틴 아메리카: 브레이브 뉴 월드", year: 2025, poster: "" },
  { id: "m36", title: "썬더볼츠*", year: 2025, poster: "" },
  { id: "m37", title: "판타스틱 4: 새로운 출발", year: 2025, poster: "" },
  { id: "m38", title: "스파이더맨: 브랜드 뉴 데이", year: 2026, poster: "" }
];

const TIERS = [
  { key: "S", color: "#ff7f7f" },
  { key: "A", color: "#ffbf7f" },
  { key: "B", color: "#ffdf7f" },
  { key: "C", color: "#ffff7f" },
  { key: "D", color: "#bfff7f" },
  { key: "F", color: "#7fbfff" }
];

const STORAGE_KEY = "marvel-tierlist-v1";
const collator = new Intl.Collator("ko", { numeric: true, sensitivity: "base" });
const movieMap = Object.fromEntries(MOVIES.map(m => [m.id, m]));

/* =========================================================
   2. 상태 & 저장
   ========================================================= */
function emptyState() {
  const tiers = {};
  TIERS.forEach(t => tiers[t.key] = []);
  return { tiers, posters: {} };
}

function loadState() {
  const state = emptyState();
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && saved.tiers) {
      const used = new Set();
      TIERS.forEach(t => {
        (saved.tiers[t.key] || []).forEach(id => {
          if (movieMap[id] && !used.has(id)) { state.tiers[t.key].push(id); used.add(id); }
        });
      });
      state.posters = saved.posters || {};
    }
  } catch (e) { /* 저장소 사용 불가 시 빈 상태로 시작 */ }
  return state;
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { showToast("저장에 실패했습니다 (브라우저 저장소를 사용할 수 없음)"); }
}

let state = loadState();

function posterOf(movie) {
  return state.posters[movie.id] || movie.poster || "";
}

/* =========================================================
   3. 렌더링
   ========================================================= */
const tierTable = document.getElementById("tierTable");
const poolEl = document.getElementById("pool");

function buildTierRows() {
  tierTable.innerHTML = "";
  TIERS.forEach(t => {
    const row = document.createElement("div");
    row.className = "tier-row";
    row.innerHTML = `<div class="tier-label" style="background:${t.color}">${t.key}</div>
                     <div class="tier-items" data-zone="${t.key}"></div>`;
    tierTable.appendChild(row);
  });
}

function createCard(movie) {
  const card = document.createElement("div");
  card.className = "card";
  card.draggable = true;
  card.dataset.id = movie.id;
  card.title = `${movie.title} (${movie.year})`;

  const url = posterOf(movie);
  if (url) {
    const img = document.createElement("img");
    img.src = url;
    img.alt = movie.title;
    img.loading = "lazy";
    img.onerror = () => img.replaceWith(createFallback(movie));
    card.appendChild(img);
    const bar = document.createElement("div");
    bar.className = "title-bar";
    bar.textContent = movie.title;
    card.appendChild(bar);
  } else {
    card.appendChild(createFallback(movie));
  }

  const edit = document.createElement("button");
  edit.className = "edit";
  edit.type = "button";
  edit.textContent = "✎";
  edit.title = "포스터 이미지 URL 변경";
  edit.addEventListener("click", e => { e.stopPropagation(); editPoster(movie); });
  edit.addEventListener("mousedown", e => e.stopPropagation());
  card.appendChild(edit);

  card.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", movie.id);
    e.dataTransfer.effectAllowed = "move";
    requestAnimationFrame(() => card.classList.add("dragging"));
  });
  card.addEventListener("dragend", () => {
    card.classList.remove("dragging");
    clearIndicators();
  });
  return card;
}

function createFallback(movie) {
  const fb = document.createElement("div");
  fb.className = "fallback";
  fb.innerHTML = `<div></div><div class="yr">${movie.year}</div>`;
  fb.firstChild.textContent = movie.title;
  return fb;
}

function render() {
  const placed = new Set();
  TIERS.forEach(t => {
    const zone = tierTable.querySelector(`[data-zone="${t.key}"]`);
    zone.innerHTML = "";
    state.tiers[t.key].forEach(id => {
      placed.add(id);
      zone.appendChild(createCard(movieMap[id]));
    });
  });

  // 대기열: 미배치 영화를 이름순(가나다·알파벳) 자동 정렬
  const pool = MOVIES.filter(m => !placed.has(m.id))
                     .sort((a, b) => collator.compare(a.title, b.title));
  poolEl.innerHTML = "";
  if (pool.length === 0) {
    poolEl.innerHTML = `<div class="empty-msg">모든 영화의 등급을 매겼습니다! 🎉</div>`;
  } else {
    pool.forEach(m => poolEl.appendChild(createCard(m)));
  }
  document.getElementById("poolCount").textContent =
    `미분류 ${pool.length}편 / 전체 ${MOVIES.length}편 · 이름순 정렬`;
}

/* =========================================================
   4. 드래그 앤 드롭
   ========================================================= */
function clearIndicators() {
  document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
  document.querySelectorAll(".insert-before").forEach(el => el.classList.remove("insert-before"));
}

// 드롭 위치 기준으로 '앞에 끼워 넣을' 카드 찾기
function findInsertTarget(zone, x, y) {
  const cards = [...zone.querySelectorAll(".card:not(.dragging)")];
  for (const c of cards) {
    const r = c.getBoundingClientRect();
    if (y < r.top) return c;                                    // 윗줄보다 위
    if (y >= r.top && y <= r.bottom && x < r.left + r.width / 2) return c; // 같은 줄, 왼쪽 절반
  }
  return null; // 맨 끝
}

function setupZone(zone) {
  zone.addEventListener("dragover", e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    clearIndicators();
    zone.classList.add("drag-over");
    if (zone.dataset.zone !== "POOL") {
      const target = findInsertTarget(zone, e.clientX, e.clientY);
      if (target) target.classList.add("insert-before");
    }
  });
  zone.addEventListener("dragleave", e => {
    if (!zone.contains(e.relatedTarget)) zone.classList.remove("drag-over");
  });
  zone.addEventListener("drop", e => {
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain");
    if (!movieMap[id]) return;
    const zoneKey = zone.dataset.zone;
    const target = zoneKey !== "POOL" ? findInsertTarget(zone, e.clientX, e.clientY) : null;
    clearIndicators();
    moveMovie(id, zoneKey, target ? target.dataset.id : null);
  });
}

function moveMovie(id, zoneKey, beforeId) {
  // 기존 위치에서 제거
  TIERS.forEach(t => {
    state.tiers[t.key] = state.tiers[t.key].filter(x => x !== id);
  });
  // 새 위치에 삽입 (대기열이면 제거만 하면 자동 정렬됨)
  if (zoneKey !== "POOL") {
    const list = state.tiers[zoneKey];
    const idx = beforeId ? list.indexOf(beforeId) : -1;
    if (idx >= 0) list.splice(idx, 0, id); else list.push(id);
  }
  saveState();
  render();
}

/* =========================================================
   5. 기타 기능
   ========================================================= */
function editPoster(movie) {
  const current = posterOf(movie);
  const url = prompt(`"${movie.title}" 포스터 이미지 URL을 입력하세요.\n(비워 두면 제목 카드로 표시됩니다)`, current);
  if (url === null) return;
  const trimmed = url.trim();
  if (trimmed) state.posters[movie.id] = trimmed;
  else delete state.posters[movie.id];
  saveState();
  render();
  showToast(trimmed ? "포스터를 변경했습니다" : "포스터를 제거했습니다");
}

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("모든 영화를 미분류 대기열로 되돌릴까요?\n(지정한 포스터 URL은 유지됩니다)")) return;
  TIERS.forEach(t => state.tiers[t.key] = []);
  saveState();
  render();
  showToast("초기화했습니다");
});

let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* =========================================================
   6. 시작
   ========================================================= */
buildTierRows();
document.querySelectorAll("[data-zone]").forEach(setupZone);
render();
</script>
</body>
</html>
